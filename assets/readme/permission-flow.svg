<svg xmlns="http://www.w3.org/2000/svg" width="960" height="238" viewBox="0 0 960 238" role="img" aria-labelledby="title desc">
  <title id="title">一次授权，一次提交</title>
  <desc id="desc">先拦住推送或创建请求，用户审阅并独立发送“授权提交”，再放行原始请求一次。失败也不能复用授权。</desc>
  <rect width="960" height="238" rx="20" fill="#f6f7f9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(24 24)">
      <rect width="280" height="190" rx="14" fill="#fff" stroke="#dce2e8"/>
      <rect width="280" height="5" rx="2.5" fill="#ee493d"/>
      <text x="22" y="37" font-size="11" font-weight="700" letter-spacing="2" fill="#bb3026">01 / HOLD</text>
      <text x="22" y="79" font-size="26" font-weight="750" fill="#08243d">先拦住</text>
      <text x="22" y="119" font-size="16" fill="#45566a">完整参数摆在你面前。</text>
      <text x="22" y="148" font-size="16" fill="#45566a">此时尚未提交。</text>
    </g>
    <g transform="translate(340 24)">
      <rect width="280" height="190" rx="14" fill="#fff" stroke="#dce2e8"/>
      <rect width="280" height="5" rx="2.5" fill="#269ac1"/>
      <text x="22" y="37" font-size="11" font-weight="700" letter-spacing="2" fill="#167598">02 / REVIEW</text>
      <text x="22" y="79" font-size="26" font-weight="750" fill="#08243d">你来决定</text>
      <text x="22" y="119" font-size="16" fill="#45566a">另发一条“授权提交”。</text>
      <text x="22" y="148" font-size="16" fill="#45566a">只授权眼前这一笔。</text>
    </g>
    <g transform="translate(656 24)">
      <rect width="280" height="190" rx="14" fill="#fff" stroke="#dce2e8"/>
      <rect width="280" height="5" rx="2.5" fill="#23855b"/>
      <text x="22" y="37" font-size="11" font-weight="700" letter-spacing="2" fill="#23734f">03 / ONCE</text>
      <text x="22" y="79" font-size="26" font-weight="750" fill="#08243d">只放行一次</text>
      <text x="22" y="119" font-size="16" fill="#45566a">原样重试这一笔请求。</text>
      <text x="22" y="148" font-size="16" fill="#45566a">失败也不能复用授权。</text>
    </g>
  </g>
  <g fill="none" stroke="#8190a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M313 119h17m-6-6 6 6-6 6"/>
    <path d="M629 119h17m-6-6 6 6-6 6"/>
  </g>
</svg>
