    <text x="44" y="444">仓库、开 Issue、提 PR（以本插件识别者为准），须先呈用户过目；</text>
    <text x="44" y="482">经用户另发整条“授权提交”，方可原样执行一次。</text>
    <text x="88" y="520">特此通知。</text>
